<div class="gallery-container">
    @if(fotos()?.length === 0) {
        <div class="empty">Nenhuma foto encontrada!</div>
    }@else {
        <div class="grid">
            @for(foto of fotos(); track foto.id) {
                <div class="img-wrapper">
                    <img [src]="'data:image/jpeg;base64,' + foto.arq64" class="img" />
                    <button class="btn-comment">
                        <span class="material-icons">comment</span>
                    </button>
                    <button class="btn-delete">
                        <span class="material-icons">delete</span>
                    </button>
                </div>
            }
        </div>
    }
</div>

<div class="fab-container">

    @if(cameraService.isMobile()) {
        <button class="fab camera" (click)="takeFoto()">
            <span class="material-icons">photo_camera</span>
        </button>
    }

    <button class="fab galeria" (click)="selecionarGaleria()">
        <span class="material-icons">photo_library</span>
    </button>
    
</div>
