<header class="app-toolbar">
    <div class="toolbar">
        <div class="area-left">
            
            @if(toolbarService.isShowBtnBack()) {
                <button class="icon-button">
                    <span class="material-icons">arrow_back</span>
                </button>
            }

            <span class="app-title">{{toolbarService.title()}}</span>

        </div>
        <div class="area-right">
           
            @if(toolbarService.isShowBtnInstall()){
                <button class="icon-button"><span class="material-icons">download</span></button>
            } 

            @if(toolbarService.isWifiOn()){
                <button class="icon-button"><span class="material-icons">wifi</span></button>
            }@else {
                <button class="icon-button"><span class="material-icons">wifi_off</span></button>
            }
            
            @if(toolbarService.isLoggedOn()){
                <button class="icon-button"><span class="material-icons">notifications</span></button>
                <button class="icon-button"><span class="material-icons">account_circle</span></button>
            }

        </div>
    </div>
</header>
