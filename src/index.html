<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Agenda do Técnico</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">   
  <meta name="theme-color" content="#045b8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agenda do Técnico">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">
  <style>
    :root {
      --app-splash-primary: #045b8f;
      --app-splash-primary-dark: #03476f;
      --app-splash-surface: #ffffff;
      --app-splash-text: #1d2733;
      --app-splash-muted: #667085;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--app-splash-surface);
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      box-sizing: border-box;
      color: var(--app-splash-text);
      background:
        radial-gradient(circle at top, rgba(4, 91, 143, 0.1), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, #f5f9fc 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      opacity: 1;
      transition: opacity 180ms ease;
    }

    #app-splash.app-splash--leaving {
      opacity: 0;
      pointer-events: none;
    }

    .app-splash__content {
      display: grid;
      justify-items: center;
      gap: 16px;
      text-align: center;
    }

    .app-splash__logo {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      box-shadow: 0 18px 42px rgba(4, 91, 143, 0.18);
    }

    .app-splash__title {
      margin: 4px 0 0;
      color: var(--app-splash-primary-dark);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .app-splash__version {
      min-height: 1rem;
      margin: -8px 0 0;
      color: var(--app-splash-muted);
      font-size: 0.75rem;
      line-height: 1.3;
    }

    .app-splash__loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(4, 91, 143, 0.15);
      border-top-color: var(--app-splash-primary);
      border-radius: 50%;
      animation: app-splash-spin 800ms linear infinite;
    }

    @keyframes app-splash-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-splash {
        transition: none;
      }

      .app-splash__loader {
        animation: none;
        border-top-color: rgba(4, 91, 143, 0.15);
      }
    }
  </style>
</head>

<body>
  <div id="app-splash" role="status" aria-live="polite" aria-label="Carregando GB Checklist">
    <div class="app-splash__content">
      <img class="app-splash__logo" src="icons/gb-checklist-splash-icon.png" alt="" width="92" height="92">
      <h1 class="app-splash__title">GB Checklist</h1>
      <p class="app-splash__version" data-app-version></p>
      <div class="app-splash__loader" aria-hidden="true"></div>
    </div>
  </div>
  <app-root></app-root>
  <noscript>Habilite o JavaScript para continuar usando o GB Checklist.</noscript>
</body>
</html>
